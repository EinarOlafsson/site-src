name: Build and deploy

# Triggers:
#   push to main           site source changed
#   workflow_dispatch      manual run (force=true rebuilds even if nothing changed)
#   repository_dispatch    event type "spacr-release", optional, sent by spaCR's release workflow
#   schedule "23 * * * *"  hourly release check: rebuild only if PyPI or GitHub has a new spaCR or ParaScape version
#   schedule "17 6 * * *"  daily full rebuild: Zenodo DOI and the papers check
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the spaCR version is unchanged"
        type: boolean
        default: true
  repository_dispatch:
    types: [spacr-release]
  schedule:
    - cron: "23 * * * *"
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - name: Compare published spaCR version with the deployed site
        id: cmp
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Event $EVENT always builds."; exit 0
          fi
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "17 6 * * *" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Daily rebuild."; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Forced manual rebuild."; exit 0
          fi
          pypi=$(curl -fsS --retry 3 https://pypi.org/pypi/spacr/json | jq -r .info.version)
          tag=$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/EinarOlafsson/spacr/releases/latest | jq -r .tag_name)
          live=$(curl -fsS --retry 3 "https://einarolafsson.github.io/build.json?t=$(date +%s)" || echo '{}')
          live_v=$(echo "$live" | jq -r '.spacr.version // ""')
          live_tag=$(echo "$live" | jq -r '.spacr.release // ""')
          live_sp=$(echo "$live" | jq -r '.parascape.version // ""')
          sp=$(curl -fsS --retry 3 https://pypi.org/pypi/parascape/json | jq -r '.info.version // ""' || true)
          if [ -z "$sp" ]; then
            echo "ParaScape is not on PyPI yet; keeping the deployed version ${live_sp:-none}."
            sp="$live_sp"
          fi
          echo "PyPI $pypi, GitHub release $tag, ParaScape $sp; site shows $live_v / $live_tag / $live_sp"
          if [ "$pypi" != "$live_v" ] || [ "$tag" != "$live_tag" ] || [ "$sp" != "$live_sp" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "### Release changed: spaCR PyPI $pypi, release $tag, ParaScape $sp (site had $live_v, $live_tag, $live_sp)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new spaCR or ParaScape version; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build, encrypt protected pages, check for leaks
        run: node tools/build.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dist/ to EinarOlafsson.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:EinarOlafsson/EinarOlafsson.github.io.git out
          old_digest="$(cat out/.protected-digest 2>/dev/null || true)"
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. out/
          cd out
          if [ -n "$old_digest" ] && [ "$old_digest" = "$(cat .protected-digest)" ]; then
            git checkout -- projects/timepose/index.html projects/cellect/index.html 2>/dev/null || true
          fi
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Deploy site-src ${GITHUB_SHA::7}"
          git push origin HEAD:main
